<svg width="1400" height="420" viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Rivulet Next hero illustration</title>
  <desc id="desc">An abstract environmental hero graphic featuring blue waves, gold highlights, and three data-themed panels for air, ocean, and water investigations.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002A4A"/>
      <stop offset="50%" stop-color="#003262"/>
      <stop offset="100%" stop-color="#005A8C"/>
    </linearGradient>
    <linearGradient id="wave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FDB515"/>
      <stop offset="100%" stop-color="#F7C948"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F2F8FC" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#001b2e" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="1400" height="420" rx="28" fill="url(#bg)"/>
  <circle cx="1140" cy="120" r="180" fill="#0C4E7A" fill-opacity="0.22"/>
  <circle cx="1110" cy="97" r="132" fill="#F7C948" fill-opacity="0.17"/>

  <path d="M-40 255C110 220 210 190 320 210C430 230 540 320 660 315C780 310 850 232 970 220C1080 210 1220 232 1440 190" stroke="#8FD2FF" stroke-opacity="0.35" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M-40 294C90 260 220 238 330 255C440 272 550 332 670 330C800 328 900 258 1030 245C1150 232 1270 250 1440 232" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M-20 345C140 306 260 292 380 310C500 329 640 379 770 368C900 357 1030 302 1150 295C1240 291 1330 306 1450 330" stroke="url(#wave)" stroke-width="8" fill="none" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="110" y="54" width="520" height="220" rx="24" fill="url(#panel)"/>
    <rect x="150" y="88" width="140" height="22" rx="11" fill="#003262" opacity="0.9"/>
    <rect x="150" y="122" width="205" height="14" rx="7" fill="#3B7EA1" opacity="0.55"/>
    <rect x="150" y="148" width="180" height="14" rx="7" fill="#3B7EA1" opacity="0.35"/>
    <rect x="150" y="186" width="300" height="70" rx="16" fill="#F7FAFD" stroke="#D8E8F3"/>
    <path d="M170 236C198 205 220 208 244 220C266 232 287 230 306 210C324 193 344 193 364 202C388 214 402 222 426 218" stroke="#FDB515" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="244" cy="220" r="7" fill="#003262"/>
    <circle cx="306" cy="210" r="7" fill="#3B7EA1"/>
    <circle cx="426" cy="218" r="7" fill="#FDB515"/>
  </g>

  <g fill="#FFFFFF" opacity="0.95" font-family="'Segoe UI', Arial, sans-serif" font-weight="700">
    <text x="112" y="332" font-size="44">Rivulet Next</text>
    <text x="112" y="366" font-size="24" font-weight="600" fill="#DDEEFF">Environmental data investigations for CODAP</text>
  </g>

  <g opacity="0.95">
    <rect x="1000" y="330" width="240" height="36" rx="18" fill="#FDB515"/>
    <text x="1120" y="348" text-anchor="middle" dominant-baseline="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#003262">Air • Ocean • Water</text>
  </g>
</svg>
